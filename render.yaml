# DESPLIEGUE GRATUITO DE PRUEBA EN RENDER
# No crea servicios de pago ni un worker independiente.
# ATENCION: Render Free suspende servicios inactivos y Postgres Free vence a los 30 dias.
databases:
  - name: observatorio-db-free
    region: oregon
    plan: free
    databaseName: observatorio
    ipAllowList: []
services:
  - type: web
    name: observatorio-web-free
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.free_server
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: observatorio-db-free
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: REVIEWER_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: COOKIE_SECURE
        value: 'true'
