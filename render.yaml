# Variante: Render Hobby / Free — solo un servicio nuevo.
# Debes disponer de una base PostgreSQL YA EXISTENTE (Render o externa).
# IMPORTANTE: requiere al menos 1 espacio libre del limite de 25 servicios.
services:
  - type: web
    name: observatorio-web-free
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.free_server
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: REVIEWER_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: COOKIE_SECURE
        value: 'true'
